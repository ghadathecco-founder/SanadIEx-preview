name: preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web
        env:
          VITE_BASE: /SanadIEx-preview/
          VITE_SUPABASE_URL: https://lyrjpipappeokxuhjzrf.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5cmpwaXBhcHBlb2t4dWhqenJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NjEyODMsImV4cCI6MjEwMjQzNzI4M30.fEnHSvoWVSEJAE4K2DK4_l-J45lNG6iqHSRd3F5qqEA
          VITE_USE_DEMO_DATA: "false"
        run: |
          npm install
          npm run build
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
